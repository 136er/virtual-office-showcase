<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <link rel="icon" type="image/png" href="%VITE_APP_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <title>%VITE_APP_TITLE%</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Ein virtuelles Büro mit 5 spezialisierten AI-Agents, die in einem Abend eine komplette E-Commerce-Plattform entwickelt haben. Multi-Agent System Showcase mit CrewAI." />
    <meta name="keywords" content="AI Agents, Multi-Agent Systems, CrewAI, React, TypeScript, Python, Django, Software Development, Agentic AI" />
    <meta name="author" content="Virtual Office Team" />
    
    <!-- Open Graph Meta Tags (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Virtual Office - Multi-Agent System Showcase" />
    <meta property="og:description" content="5 spezialisierte AI-Agents haben in einem Abend eine komplette E-Commerce-Plattform entwickelt. Sehen Sie die Zukunft der Software-Entwicklung!" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://virtual-office-showcase.manus.space" />
    <meta property="og:site_name" content="Virtual Office" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Virtual Office - Multi-Agent System Showcase" />
    <meta name="twitter:description" content="5 spezialisierte AI-Agents haben in einem Abend eine komplette E-Commerce-Plattform entwickelt. Interaktive Demo verfügbar!" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="German" />
    <meta name="theme-color" content="#0f172a" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
